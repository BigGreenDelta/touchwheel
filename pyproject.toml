[project]
name = "touchwheel"
version = "0.1.0"
description = "Touch-to-wheel shim so a touchscreen can scroll full-screen terminal apps in Windows Terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
touchwheel = "touchwheel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["touchwheel.py"]

[tool.hatch.build.targets.wheel.sources]
"touchwheel.py" = "touchwheel.py"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
